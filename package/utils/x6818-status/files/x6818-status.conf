# LCD4Linux GPL-2.0-or-later; x6818 layout GPL-2.0-only.
# 8x16 font on the 1024x600 RGB panel provides 128x37 cells.
# Kernel printk uses tty1; this layout owns tty2.
Display Screen {
    Driver 'Curses'
    Size '78x22'
}

Widget Title {
    class 'Text'
    expression 'x6818 / OpenWrt system status'
    width 76
    align 'L'
    update 1000
}

Widget Host {
    class 'Text'
    expression 'Host: '.uname('nodename').'   Architecture: '.uname('machine')
    width 76
    align 'L'
    update 1000
}

Widget Kernel {
    class 'Text'
    expression 'Kernel: '.uname('release')
    width 76
    align 'L'
    update 1000
}

Widget Uptime {
    class 'Text'
    expression uptime('%d days %H:%M:%S')
    width 76
    align 'L'
    update 1000
    prefix 'Uptime: '
}

Widget CPU {
    class 'Text'
    expression proc_stat::cpu('busy', 1000)
    width 76
    align 'L'
    update 1000
    prefix 'CPU busy: '
    postfix ' %'
    precision 1
}

Widget Load {
    class 'Text'
    expression loadavg(1)
    width 76
    align 'L'
    update 1000
    prefix 'Load average (1 min): '
    precision 2
}

Widget Memory {
    class 'Text'
    expression (meminfo('MemTotal')-meminfo('MemAvailable'))/1024
    width 76
    align 'L'
    update 1000
    prefix 'Memory used: '
    postfix ' MiB'
    precision 1
}

Widget Available {
    class 'Text'
    expression meminfo('MemAvailable')/1024
    width 76
    align 'L'
    update 1000
    prefix 'Memory available: '
    postfix ' MiB'
    precision 1
}

Widget Address {
    class 'Text'
    expression netinfo::exists('br-lan') ? netinfo::ipaddr('br-lan') : 'unassigned'
    width 76
    align 'L'
    update 1000
    prefix 'LAN IPv4: '
}

Widget RX {
    class 'Text'
    expression netdev('eth0', 'Rx_bytes', 1000)/1024
    width 76
    align 'L'
    update 1000
    prefix 'Ethernet RX: '
    postfix ' KiB/s'
    precision 1
}

Widget TX {
    class 'Text'
    expression netdev('eth0', 'Tx_bytes', 1000)/1024
    width 76
    align 'L'
    update 1000
    prefix 'Ethernet TX: '
    postfix ' KiB/s'
    precision 1
}

Widget Root {
    class 'Text'
    expression statfs('/', 'bavail')*statfs('/', 'bsize')/1048576
    width 76
    align 'L'
    update 1000
    prefix 'Rootfs available: '
    postfix ' MiB'
    precision 1
}

Widget Help {
    class 'Text'
    expression 'Logs: tty1 + serial | Service: /etc/init.d/x6818-status'
    width 76
    align 'L'
    update 1000
}

Layout Status {
    Row1.Col1 'Title'
    Row3.Col1 'Host'
    Row4.Col1 'Kernel'
    Row6.Col1 'Uptime'
    Row8.Col1 'CPU'
    Row9.Col1 'Load'
    Row11.Col1 'Memory'
    Row12.Col1 'Available'
    Row14.Col1 'Address'
    Row16.Col1 'RX'
    Row17.Col1 'TX'
    Row19.Col1 'Root'
    Row22.Col1 'Help'
}

Display 'Screen'
Layout 'Status'
