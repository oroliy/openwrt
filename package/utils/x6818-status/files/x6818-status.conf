# LCD4Linux GPL-2.0-or-later; x6818 layout GPL-2.0-only.
# 8x16 font on the 1024x600 RGB panel provides 128x37 cells.
# Kernel printk uses tty1; this layout owns tty2.
Display Screen {
    Driver 'Curses'
    Size '78x31'
}

Widget Title {
    class 'Text'
    expression 'x6818 / OpenWrt system status'
    width 76
    align 'L'
    update 1000
}

Widget Host {
    class 'Text'
    expression 'Host: '.uname('nodename').'   Architecture: '.uname('machine')
    width 76
    align 'L'
    update 1000
}

Widget Kernel {
    class 'Text'
    expression 'Kernel: '.uname('release')
    width 76
    align 'L'
    update 1000
}

Widget Uptime {
    class 'Text'
    expression uptime('%d days %H:%M:%S')
    width 76
    align 'L'
    update 1000
    prefix 'Uptime: '
}

Widget CPU {
    class 'Text'
    expression proc_stat::cpu('busy', 1000)
    width 76
    align 'L'
    update 1000
    prefix 'CPU busy: '
    postfix ' %'
    precision 1
}

Widget Load {
    class 'Text'
    expression loadavg(1)
    width 76
    align 'L'
    update 1000
    prefix 'Load average (1 min): '
    precision 2
}

Widget Memory {
    class 'Text'
    expression (meminfo('MemTotal')-meminfo('MemAvailable'))/1024
    width 76
    align 'L'
    update 1000
    prefix 'Memory used: '
    postfix ' MiB'
    precision 1
}

Widget Available {
    class 'Text'
    expression meminfo('MemAvailable')/1024
    width 76
    align 'L'
    update 1000
    prefix 'Memory available: '
    postfix ' MiB'
    precision 1
}

Widget Address0 {
    class 'Text'
    expression strlen(file::readline('/var/run/x6818-addresses', 1)) ? file::readline('/var/run/x6818-addresses', 1) : 'Local addresses: waiting'
    width 76
    align 'L'
    update 1000
}

Widget Address1 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 2)
    width 76
    align 'L'
    update 1000
}

Widget Address2 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 3)
    width 76
    align 'L'
    update 1000
}

Widget Address3 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 4)
    width 76
    align 'L'
    update 1000
}

Widget Address4 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 5)
    width 76
    align 'L'
    update 1000
}

Widget Address5 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 6)
    width 76
    align 'L'
    update 1000
}

Widget Address6 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 7)
    width 76
    align 'L'
    update 1000
}

Widget Address7 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 8)
    width 76
    align 'L'
    update 1000
}

Widget Address8 {
    class 'Text'
    expression file::readline('/var/run/x6818-addresses', 9)
    width 76
    align 'L'
    update 1000
}

Widget RX {
    class 'Text'
    expression netdev('eth0', 'Rx_bytes', 1000)/1024
    width 76
    align 'L'
    update 1000
    prefix 'Ethernet RX: '
    postfix ' KiB/s'
    precision 1
}

Widget TX {
    class 'Text'
    expression netdev('eth0', 'Tx_bytes', 1000)/1024
    width 76
    align 'L'
    update 1000
    prefix 'Ethernet TX: '
    postfix ' KiB/s'
    precision 1
}

Widget Root {
    class 'Text'
    expression statfs('/', 'bavail')*statfs('/', 'bsize')/1048576
    width 76
    align 'L'
    update 1000
    prefix 'Rootfs available: '
    postfix ' MiB'
    precision 1
}

Widget Help {
    class 'Text'
    expression 'Logs: tty1 + serial | Service: /etc/init.d/x6818-status'
    width 76
    align 'L'
    update 1000
}

Widget Temperature0 {
    class 'Text'
    expression strlen(file::readline('/var/run/x6818-temperature', 1)) ? file::readline('/var/run/x6818-temperature', 1) : 'N/A'
    width 76
    align 'L'
    update 2000
    prefix 'SoC temperature (TMU0): '
}

Widget Temperature1 {
    class 'Text'
    expression strlen(file::readline('/var/run/x6818-temperature', 2)) ? file::readline('/var/run/x6818-temperature', 2) : 'N/A'
    width 76
    align 'L'
    update 2000
    prefix 'SoC temperature (TMU1): '
}

Layout Status {
    Row1.Col1 'Title'
    Row3.Col1 'Host'
    Row4.Col1 'Kernel'
    Row6.Col1 'Uptime'
    Row8.Col1 'CPU'
    Row9.Col1 'Load'
    Row11.Col1 'Memory'
    Row12.Col1 'Available'
    Row14.Col1 'Address0'
    Row15.Col1 'Address1'
    Row16.Col1 'Address2'
    Row17.Col1 'Address3'
    Row18.Col1 'Address4'
    Row19.Col1 'Address5'
    Row20.Col1 'Address6'
    Row21.Col1 'Address7'
    Row22.Col1 'Address8'
    Row24.Col1 'RX'
    Row25.Col1 'TX'
    Row27.Col1 'Root'
    Row28.Col1 'Temperature0'
    Row29.Col1 'Temperature1'
    Row31.Col1 'Help'
}

Display 'Screen'
Layout 'Status'
